name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      # The real-OpenCode tests run on the pinned line (see template/docs/environment.md); they
      # need no model key.
      - if: runner.os == 'Linux'
        run: npm install -g opencode-ai@1.18
      - run: npm test
